version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tn_waste_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/waste_management.db
      - JWT_SECRET=state_waste_mgmt_secret_key_cloud_production_2026

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tn_waste_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
